schema_version: trust_gate_tolerances.v1
profile_id: institutional-default
version: "2025.10.17"
updated_at: "2025-10-17"
description: >-
  Institutional default tolerance profile enforcing corporate-action reconciliation,
  accounting balance checks, and timezone normalization requirements for the
  trust gate framework.
metadata:
  maintained_by: trust-gate-governance
  fr_references:
    - FR-204
    - FR-205
    - FR-206
    - FR-207
    - FR-208
  notes:
    - Baseline for institutional deployments; any override requires waiver per WAIVERS.md.
    - Accounting tolerances follow research decision log entry #7.
    - Timezone handling aligns with DST/leap-second research findings.
    - Journaling tolerances enforce artifact presence, schema version 2025.10.16, canonical hash verification, and manifest reconciliation telemetry counters per Phase 4 governance.
  gate_defaults:
    equity_reconciliation:
      absolute_currency_tolerance: 0.01
      relative_basis_points_tolerance: 5
      compare_adjusted_vs_unadjusted: true
      require_corporate_action_metadata: true
    accounting_balance:
      absolute_currency_tolerance: 0.01
      relative_basis_points_tolerance: 5
      enforce_decimal_precision: true
      ledger_precision: 6
      rounding_mode: bankers
    ingest_idempotency:
      max_retry_attempts: 3
      enforce_schema_version_match: true
      require_row_count_match: true
      permitted_hash_delta: 0
    timezone_normalization:
      require_utc_storage: true
      max_offset_seconds: 0
      ambiguous_transition_buffer_minutes: 5
      allow_leap_second_events: true
      max_dst_gap_seconds: 60
    universe_stamp:
      fail_on_missing_symbols: true
      warn_on_additional_symbols: true
      max_symbol_delta: 0
    causality_guardrails:
      max_leakage_score: 0.05
      max_equity_drift: 0.000001
      sharpe_floor: 0.0
    golden_run_determinism:
      require_manifest_match: true
      require_artifact_hash_match: true
      require_sqlite_digest_match: true
      allow_baseline_version_mismatch: false
    journaling:
      required_artifacts:
        - completed_trades.json
      expected_schema_version: "2025.10.16"
      enforce_manifest_signature: true
      waiver_reference: journaling.artifact.required
      diagnostics_surface:
        - schema_version
        - manifest_signature
        - computed_signature
      metrics:
        - trust_gate_journaling_manifest_reconciliations
        - trust_gate_manifest_payload_size_bytes
metrics:
  leakage_score:
    comparator: "<="
    threshold: 0.05
    severity: fail
    description: Permutation leakage score must not exceed 5%.
  equity_drift:
    comparator: "<="
    threshold: 0.0005
    severity: fail
    description: Equity drift must remain within 5e-4 of baseline equity.
